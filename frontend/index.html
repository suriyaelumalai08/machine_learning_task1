<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction</title>
</head>
<body>

<h2>Diabetes Prediction</h2>

<input id="Pregnancies" placeholder="Pregnancies"><br><br>
<input id="Glucose" placeholder="Glucose"><br><br>
<input id="BloodPressure" placeholder="Blood Pressure"><br><br>
<input id="SkinThickness" placeholder="Skin Thickness"><br><br>
<input id="Insulin" placeholder="Insulin"><br><br>
<input id="BMI" placeholder="BMI"><br><br>
<input id="DiabetesPedigreeFunction" placeholder="DPF"><br><br>
<input id="Age" placeholder="Age"><br><br>

<button onclick="predict()">Predict</button>

<h3 id="result"></h3>

<script>
function predict() {
    const data = {
        Pregnancies: Number(document.getElementById("Pregnancies").value),
        Glucose: Number(document.getElementById("Glucose").value),
        BloodPressure: Number(document.getElementById("BloodPressure").value),
        SkinThickness: Number(document.getElementById("SkinThickness").value),
        Insulin: Number(document.getElementById("Insulin").value),
        BMI: Number(document.getElementById("BMI").value),
        DiabetesPedigreeFunction: Number(document.getElementById("DiabetesPedigreeFunction").value),
        Age: Number(document.getElementById("Age").value)
    };

    fetch("https://machine-learning-task1.onrender.com/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        document.getElementById("result").innerText =
            result.prediction == 1 ? "Diabetes Detected" : "No Diabetes";
    })
    .catch(error => {
        document.getElementById("result").innerText = "API Error";
        console.error(error);
    });
}
</script>

</body>
</html>
